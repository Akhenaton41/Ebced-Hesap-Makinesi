function baslangic(){
    // --- LOCALSTORAGE AYAR OKUMA ---

    var hafizadakiKlavye = localStorage.getItem("seciliKlavye");  // radio-one, radio-two, vb.

        id(hafizadakiKlavye).checked = true;

    } else {
        // Hafýza boþsa veya element bulunamadýysa ÝLK ELEMENTÝ (Osmanlýca) güvenle seçiyoruz

        }

    // ---------------------------------------
    
    if(id("R1")){ id("R1").checked = true; }
    
    // --- GÜNCELLEME: Hafýza kontrolüne göre varsayýlan ebced yöntemini seç ---
    if (hafizadakiYontem && id(hafizadakiYontem)) {

    } else {
        if (id("R3")) { id("R3").checked = true; } // Hiç kayýt yoksa Asýl Temel Ebced
    }

            id("gizliDiv").innerText=isimler[i]
            orj.push(id("gizliDiv").innerText)
            }
        }
        
    if(orj.length > 0) {
        if(orj[0].indexOf("Â·")>-1){
            ayrac="Â·"
        }else if(orj[0].indexOf(String.fromCharCode(183))>-1){
            ayrac=String.fromCharCode(183)

        }

    orj.sort()

			}
		
		
		}
	
	
	//
	bulunamadi=false
	arabic = /[\u0600-\u06FF]/;
	
	for (jj = 0; jj < isim1.length; jj++) {
		
		if(!arabic.test(isim1[jj])){
			alert(isim1[jj]+" ismi veritabanýnda kayýtlý deðil!")
			bulunamadi=true
			break;
			}
		}
	
	if(!bulunamadi){
		isim1=isim1.join(" ")
		isimEkle(isim1,true)
		}
	}

function isimEkle(e,Default){

		e2=e.trim()
	}else{
		e1=e[0].value.trim()
		e2=e[1].value.trim()
		}
	
	a$="Ýsim: <span id='isimAlani'>"+e1+"</span> (Arapça: <span style=\"font-family:'Amiri', serif; font-size:20px !important;\">"+e2+"</span>)<br>"
	a$+="<button id='Kopyala'>Ekrana Kopyala</button> "

	a$+="<button onclick='Temizle()'>Temizle</button>"
